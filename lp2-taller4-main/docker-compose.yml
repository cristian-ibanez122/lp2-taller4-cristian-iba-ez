
services:
  database:
    image: postgres:15
    container_name: gameflow_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: gameflow_api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: gameflow_frontend
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    build: ./nginx
    container_name: gameflow_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
